name: data_collector

description: A Flutter data collection application.

publish_to: 'none'


version: 1.0.0+1



environment:
  sdk: '>=3.0.0 <4.0.0'



dependencies:

  excel: ^4.0.6

  path_provider: ^2.1.4

  share_plus: ^13.3.0


  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8


  sqflite: ^2.3.3

  path: ^1.9.0


  geolocator: ^14.0.3

  flutter_map: ^8.3.2

  latlong2: any




dev_dependencies:

  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4





flutter:

  uses-material-design: true


  assets:

    - assets/icon/Sabtino.png





flutter_launcher_icons:

  android: true

  ios: true

  image_path: "assets/icon/Sabtino.png"